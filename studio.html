<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar studio</title>
<style>
  :root { --bg:#111317; --panel:#191c22; --line:#2a2f38; --text:#e8eaed; --muted:#9aa3af;
          --accent:#7cc4ff; --accent-ink:#06243a; --bad:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:14px;
           align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header .note { color:var(--muted); font-size:12px; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px; display:grid; gap:20px; }

  #drop { border:1.5px dashed var(--line); border-radius:12px; padding:28px 20px; text-align:center;
          background:var(--panel); transition:border-color .15s, background .15s; }
  #drop.over { border-color:var(--accent); background:#1b222b; }
  #drop p { margin:0 0 14px; color:var(--muted); }
  .row { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:9px 16px; cursor:pointer;
           background:var(--accent); color:var(--accent-ink); }
  button.ghost { background:#222730; color:var(--text); font-weight:500; }
  button[disabled] { opacity:.55; cursor:default; }
  input[type=file] { display:none; }
  #chosen { color:var(--muted); font-size:13px; }
  .toggle { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .toggle input { accent-color:var(--accent); }
  select.toggle { background:#222730; color:var(--text); border:1px solid var(--line);
                  border-radius:8px; padding:8px 10px; font:inherit; }
  #status { min-height:20px; font-size:13px; color:var(--muted); text-align:center; }
  #status.bad { color:var(--bad); }

  #result { display:none; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel); }
  #result iframe { width:100%; height:62vh; border:0; display:block; }
  .resultbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 12px; border-bottom:1px solid var(--line); }
  #resultmeta { color:var(--muted); font-size:12px; }
  #download { padding:7px 14px; font-size:13px; }

  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
       margin:0 0 10px; font-weight:600; }
  #gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
          cursor:pointer; text-align:left; padding:0; display:block; }
  .card:hover { border-color:var(--accent); }
  /* Portrait, and contained: a square crop cut the head off every full-body avatar. */
  .card img { width:100%; aspect-ratio:11/14; object-fit:contain; display:block; background:#0d0f13; }
  .card .meta { padding:8px 10px; }
  .card .when { font-size:12px; color:var(--text); }
  .card .expr { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .shot { position:relative; }
  .card .badge { position:absolute; top:6px; left:6px; font-size:10px; letter-spacing:.04em;
    text-transform:uppercase; background:rgba(17,19,23,.78); color:var(--muted);
    padding:2px 6px; border-radius:999px; }
  .card .badge.body { color:var(--accent); }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Avatar studio</h1>
  <span class="note">internal testing tool · one photo in, a 3D face out · no login, keep it on the office network</span>
</header>

<div class="wrap">
  <form id="drop">
    <p>Drop a photo here, or pick one. Front-facing and well lit works best.</p>
    <div class="row">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/bmp">
      <button type="button" class="ghost" id="pick">Choose photo</button>
      <select id="dimension" class="toggle" title="what to produce">
        <option value="3d">3D model</option>
        <option value="2d">2D image</option>
      </select>
      <label class="toggle"><input type="checkbox" id="fullbody" checked> Full body</label>
      <select id="gender" class="toggle" title="which default outfit to dress the avatar in">
        <option value="male">Male outfit</option>
        <option value="female">Female outfit</option>
      </select>
      <button type="submit" id="go" disabled>Generate avatar</button>
      <span id="chosen"></span>
    </div>
  </form>

  <div id="status"></div>

  <div id="result">
    <div class="resultbar">
      <span id="resultmeta"></span>
      <button type="button" id="download">Download</button>
    </div>
    <iframe id="viewer" title="generated avatar"></iframe>
  </div>

  <section>
    <h2>Earlier avatars</h2>
    <div id="gallery"></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { setupRealism, applyMaterials, groundAndShadow, withOcclusion } from '/lib/scene-setup.js';

const $ = (id) => document.getElementById(id);
const drop = $('drop'), file = $('file'), go = $('go'), status = $('status'),
      result = $('result'), viewer = $('viewer'), gallery = $('gallery'), chosen = $('chosen');
let current = null;  // the avatar on screen: what Download acts on

function setFile(f) {
  if (!f) return;
  file.files = (() => { const dt = new DataTransfer(); dt.items.add(f); return dt.files; })();
  chosen.textContent = f.name;
  go.disabled = false;
  status.textContent = '';
  status.className = '';
}

$('pick').addEventListener('click', () => file.click());
file.addEventListener('change', () => setFile(file.files[0]));

['dragenter', 'dragover'].forEach((e) =>
  drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((e) =>
  drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (ev) => setFile(ev.dataTransfer.files[0]));

drop.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!file.files[0]) return;
  go.disabled = true;
  status.className = '';
  status.textContent = 'Fitting the face…';

  const body = new FormData();
  body.append('photo', file.files[0]);
  body.append('mode', $('fullbody').checked ? 'body' : 'face');
  body.append('gender', $('gender').value);
  try {
    const res = await fetch('/generate', { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Generation failed.');
    current = { model: data.model, id: data.id, fullBody: $('fullbody').checked };
    show(data.review);
    status.textContent = `Done · ${data.info.triangles} triangles · ${data.info.size_kb} KB`;
    $('resultmeta').textContent = $('dimension').value === '2d'
      ? 'Download gives a transparent PNG rendered from this avatar.'
      : 'Download gives a GLB: opens in Unity, Unreal, Blender and three.js.';
    loadGallery();
  } catch (err) {
    status.className = 'bad';
    status.textContent = err.message;
  } finally {
    go.disabled = false;
  }
});

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

$('download').addEventListener('click', async () => {
  if (!current) return;
  const button = $('download');
  const wasText = button.textContent;
  button.disabled = true;
  try {
    if ($('dimension').value === '2d') {
      button.textContent = 'Rendering…';
      const png = await renderPng(current.model, current.fullBody);
      saveBlob(png, `${current.id}.png`);
    } else {
      // The GLB is already on the server; let the browser fetch it as a file.
      const link = document.createElement('a');
      link.href = current.model;
      link.download = `${current.id}.glb`;
      link.click();
    }
  } catch (err) {
    status.className = 'bad';
    status.textContent = `Download failed: ${err.message}`;
  } finally {
    button.textContent = wasText;
    button.disabled = false;
  }
});

$('dimension').addEventListener('change', () => {
  if (!current) return;
  $('resultmeta').textContent = $('dimension').value === '2d'
    ? 'Download gives a transparent PNG rendered from this avatar.'
    : 'Download gives a GLB: opens in Unity, Unreal, Blender and three.js.';
});

function show(reviewUrl) {
  viewer.src = reviewUrl;
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function loadGallery() {
  const items = await fetch('/gallery.json').then((r) => r.json()).catch(() => []);
  if (!items.length) { gallery.innerHTML = '<span class="empty">Nothing generated yet.</span>'; return; }
  gallery.innerHTML = '';
  for (const it of items) {
    const card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    const expr = it.expression.map(([k, v]) => k).join(', ') || 'neutral';
    const label = it.kind === 'full-body' ? (it.rigged ? 'full body · rigged' : 'full body') : 'face only';
    card.innerHTML =
      `<div class="shot"><img alt="" data-model="${it.model}">` +
      `<span class="badge ${it.kind === 'full-body' ? 'body' : ''}">${label}</span></div>` +
      `<div class="meta"><div class="when">${it.created}</div><div class="expr">${expr}</div></div>`;
    card.addEventListener('click', () =>
      show(`/review.html?model=${encodeURIComponent(it.model)}&photo=${encodeURIComponent(it.photo || '')}`));
    gallery.appendChild(card);
  }
  renderThumbnails();
}

// Thumbnails are renders of the avatar, not the photo it came from. Showing the
// source photo made the gallery look like a photo album and hid whether an entry
// was a face patch or a dressed figure.
const THUMB_W = 220, THUMB_H = 280;
let sharedRenderer = null;
const gltfLoader = new GLTFLoader();

function getRenderer(width, height) {
  if (!sharedRenderer) {
    // alpha, so a 2D export comes out on a transparent background and drops
    // straight into a UI without a backdrop to cut away.
    sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    sharedRenderer.setPixelRatio(1);
  }
  sharedRenderer.setSize(width, height);
  return sharedRenderer;
}

function disposeScene(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) { m?.map?.dispose(); m?.dispose(); }
  });
}

// One WebGL canvas serves the gallery and the downloads, so renders have to
// take turns. Without this a download fired while the gallery is still drawing
// captures whatever frame landed last — in practice, a blank image.
let renderTurn = Promise.resolve();
function takeTurn(job) {
  const run = renderTurn.then(job, job);
  renderTurn = run.then(() => {}, () => {});
  return run;
}

async function drawAvatar(url, width, height, focusHead = false) {
  const gltf = await gltfLoader.loadAsync(url);
  const scene = new THREE.Scene();
  const lights = setupRealism(getRenderer(width, height), scene);

  const model = gltf.scene;
  applyMaterials(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  scene.add(model);
  groundAndShadow(scene, model, lights.key);

  const camera = new THREE.PerspectiveCamera(32, width / height, 0.01, 200);
  // Fit whichever dimension needs the most room. Fitting width alone clipped the
  // head off every full-body avatar, which is the one thing the card must show.
  const span = focusHead ? size.y * 0.17 : size.y;
  const fit = Math.max(span, size.x / camera.aspect);
  const eye = focusHead ? size.y / 2 - size.y * 0.085 : 0;
  camera.position.set(0, eye, (fit / (2 * Math.tan((32 * Math.PI) / 360))) * 1.12);
  camera.lookAt(0, eye, 0);

  const renderer = getRenderer(width, height);
  const occlusion = withOcclusion(renderer, scene, camera);
  occlusion.render();
  occlusion.dispose();
  disposeScene(model);
  return renderer.domElement;
}

/** Render and encode without letting go of the canvas in between. */
function renderAvatar(url, width, height, focusHead, encode) {
  return takeTurn(async () => {
    const canvas = await drawAvatar(url, width, height, focusHead);
    return encode(canvas);
  });
}

async function renderThumbnail(url) {
  return renderAvatar(url, THUMB_W, THUMB_H, false,
    (canvas) => canvas.toDataURL('image/webp', 0.8));
}

/** A 2D avatar: the 3D one rendered to a transparent PNG. */
async function renderPng(url, fullBody) {
  const [w, h] = fullBody ? [900, 1200] : [900, 900];
  return renderAvatar(url, w, h, !fullBody,
    (canvas) => new Promise((resolve) => canvas.toBlob(resolve, 'image/png')));
}

async function renderThumbnails() {
  // One at a time: each avatar is about a megabyte and they are only decoration.
  for (const img of gallery.querySelectorAll('img[data-model]')) {
    try {
      img.src = await renderThumbnail(img.dataset.model);
    } catch (err) {
      console.warn('thumbnail failed', img.dataset.model, err);
    }
  }
}

// Handle for checking the renderers from the console, same idea as
// window.__avatar on the review page.
window.__studio = { renderPng, renderThumbnail };

loadGallery();
</script>
</body>
</html>
