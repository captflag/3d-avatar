<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar studio</title>
<style>
  :root { --bg:#111317; --panel:#191c22; --line:#2a2f38; --text:#e8eaed; --muted:#9aa3af;
          --accent:#7cc4ff; --accent-ink:#06243a; --bad:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:14px;
           align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; }
  header .note { color:var(--muted); font-size:12px; }
  .wrap { max-width:1200px; margin:0 auto; padding:20px; display:grid; gap:20px; }

  #drop { border:1.5px dashed var(--line); border-radius:12px; padding:28px 20px; text-align:center;
          background:var(--panel); transition:border-color .15s, background .15s; }
  #drop.over { border-color:var(--accent); background:#1b222b; }
  #drop p { margin:0 0 14px; color:var(--muted); }
  .row { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:9px 16px; cursor:pointer;
           background:var(--accent); color:var(--accent-ink); }
  button.ghost { background:#222730; color:var(--text); font-weight:500; }
  button[disabled] { opacity:.55; cursor:default; }
  input[type=file] { display:none; }
  #chosen { color:var(--muted); font-size:13px; }
  .toggle { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; }
  .toggle input { accent-color:var(--accent); }
  select.toggle { background:#222730; color:var(--text); border:1px solid var(--line);
                  border-radius:8px; padding:8px 10px; font:inherit; }
  #guide { margin:18px auto 0; max-width:1000px; text-align:left; }
  #guide summary { color:var(--muted); font-size:13px; cursor:pointer; text-align:center; }
  #guide img { display:block; width:100%; height:auto; margin-top:12px; }
  /* On a phone the guide keeps a readable size and scrolls sideways in its box. */
  #guide .scroll { overflow-x:auto; }
  #drop { min-width:0; }        /* a grid item, it would otherwise grow to the guide's width */
  @media (max-width:760px) { #guide img { width:720px; max-width:none; } }
  #status { min-height:20px; font-size:13px; color:var(--muted); text-align:center; }
  #status.bad { color:var(--bad); }
  #advice { font-size:13px; color:var(--muted); text-align:center; }
  #advice:empty { display:none; }
  #advice ul { margin:4px 0 0; padding:0; list-style:none; color:var(--bad); }

  #result { display:none; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--panel); }
  #result iframe { width:100%; height:62vh; border:0; display:block; }
  .resultbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 12px; border-bottom:1px solid var(--line); }
  #resultmeta { color:var(--muted); font-size:12px; }
  #download { padding:7px 14px; font-size:13px; }

  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
       margin:0 0 10px; font-weight:600; }
  #gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
          cursor:pointer; text-align:left; padding:0; display:block; }
  .card:hover { border-color:var(--accent); }
  /* Portrait, and contained: a square crop cut the head off every full-body avatar. */
  .card img { width:100%; aspect-ratio:11/14; object-fit:contain; display:block; background:#0d0f13; }
  .card .meta { padding:8px 10px; }
  .card .when { font-size:12px; color:var(--text); }
  .card .expr { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .shot { position:relative; }
  .card .badge { position:absolute; top:6px; left:6px; font-size:10px; letter-spacing:.04em;
    text-transform:uppercase; background:rgba(17,19,23,.78); color:var(--muted);
    padding:2px 6px; border-radius:999px; }
  .card .badge.body { color:var(--accent); }
  .empty { color:var(--muted); font-size:13px; }

  #camera { display:none; border:1px solid var(--line); border-radius:12px; background:var(--panel);
            padding:14px; gap:16px; grid-template-columns:minmax(0,3fr) minmax(220px,2fr); }
  #camera.open { display:grid; }
  #camera .frame { position:relative; background:#0d0f13; border-radius:8px; overflow:hidden; }
  /* A mirror, as every selfie camera shows; the photo itself is taken unmirrored. */
  #camera video { width:100%; display:block; transform:scaleX(-1); }
  #camera .frame img { width:100%; max-height:70vh; object-fit:contain; display:block; }
  #camera .frame img:not([hidden]) ~ .oval { display:none; }
  #camera .frame :is(video,img)[hidden] { display:none; }
  #shots { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 12px; }
  #shots figure { margin:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:12px; color:var(--muted); }
  #shots figure.now { border-color:var(--accent); color:var(--text); }
  #shots img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#0d0f13; }
  #shots figcaption { padding:3px 6px; }
  #steptitle { margin:0 0 6px; font-size:15px; }
  #stepask { margin:0 0 12px; color:var(--muted); font-size:13px; }
  #camera .oval { position:absolute; left:50%; top:46%; width:34%; aspect-ratio:3/4;
                  transform:translate(-50%,-50%); border:2px dashed rgba(255,255,255,.35); border-radius:50%; }
  #camera.ready .oval { border-color:var(--accent); border-style:solid; }
  #checks { list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px; font-size:13px; }
  #checks li { color:var(--muted); }
  #checks li.ok { color:var(--text); }
  #checks li .mark { display:inline-block; width:18px; color:var(--bad); }
  #checks li.ok .mark { color:var(--accent); }
  #camnote { color:var(--muted); font-size:12px; min-height:18px; margin:0 0 12px; }
  @media (max-width:700px) { #camera { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Avatar studio</h1>
  <span class="note">internal testing tool · one photo in, a 3D face out · no login, keep it on the office network</span>
</header>

<div class="wrap">
  <form id="drop">
    <p>Drop a photo here, choose one, or take one with the camera. Front-facing and well lit works best.</p>
    <div class="row">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/bmp">
      <button type="button" class="ghost" id="pick">Choose from gallery</button>
      <button type="button" class="ghost" id="usecamera" title="front, then turned left and right: the depth one photo can only guess">Guided capture</button>
      <select id="dimension" class="toggle" title="what to produce">
        <option value="3d">3D model</option>
        <option value="2d">2D image</option>
        <option value="3d-compat" title="without mesh compression, for old viewers such as Windows 3D Viewer">3D model, older viewers</option>
      </select>
      <label class="toggle"><input type="checkbox" id="fullbody" checked> Full body</label>
      <label class="toggle" title="2D image: turn the head as it was in the photo instead of level"><input type="checkbox" id="photopose"> Photo's head pose</label>
      <select id="gender" class="toggle" title="which default outfit to dress the avatar in">
        <option value="male">Male outfit</option>
        <option value="female">Female outfit</option>
      </select>
      <button type="submit" id="go" disabled>Generate avatar</button>
      <span id="chosen"></span>
    </div>
    <!-- A drawn example, not a real person: what costs likeness, measured on
         the test faces (REALISM-GAP.md, photo-10: a 52-pixel face). -->
    <details id="guide" open>
      <summary>What photo works best</summary>
      <div class="scroll"><img src="/lib/photo-guide.svg" width="1000" height="350"
           alt="Like this: face fills about a third of the frame, looking straight at the camera, soft even light, relaxed face with mouth closed, no glasses or hat, sharp. Avoid: too far away, sunglasses, head turned, a big laugh, back-lit or dark, blurry."></div>
    </details>
  </form>

  <section id="camera" aria-label="camera">
    <div class="frame">
      <video id="video" playsinline muted></video>
      <img id="still" alt="the photo chosen for this step" hidden>
      <div class="oval"></div>
    </div>
    <div>
      <div id="shots">
        <figure><img alt=""><figcaption>1 · Front</figcaption></figure>
        <figure><img alt=""><figcaption>2 · Your left</figcaption></figure>
        <figure><img alt=""><figcaption>3 · Your right</figcaption></figure>
      </div>
      <h3 id="steptitle"></h3>
      <p id="stepask"></p>
      <ul id="checks"></ul>
      <p id="camnote">Starting the camera…</p>
      <div class="row" style="justify-content:flex-start">
        <button type="button" id="shoot" hidden>Take photo anyway</button>
        <!-- Without a camera here (not localhost or https, or none fitted) each
             step takes a photo instead; on a phone this opens its own camera. -->
        <input type="file" id="stepfile" accept="image/*" capture="user">
        <button type="button" class="ghost" id="usefile">Use a photo instead</button>
        <button type="button" class="ghost" id="skip" hidden>Skip</button>
        <button type="button" class="ghost" id="closecamera">Cancel</button>
      </div>
    </div>
  </section>

  <div id="status"></div>
  <div id="advice" aria-live="polite"></div>

  <div id="result">
    <div class="resultbar">
      <span id="resultmeta"></span>
      <button type="button" id="download">Download</button>
    </div>
    <iframe id="viewer" title="generated avatar"></iframe>
  </div>

  <section>
    <h2>Earlier avatars</h2>
    <div id="gallery"></div>
  </section>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { setupRealism, applyMaterials, applyPhotoExpression, applyPhotoPose, groundAndShadow, withOcclusion, renderCoverage } from '/lib/scene-setup.js';

const $ = (id) => document.getElementById(id);
const drop = $('drop'), file = $('file'), go = $('go'), status = $('status'),
      result = $('result'), viewer = $('viewer'), gallery = $('gallery'), chosen = $('chosen');
let current = null;  // the avatar on screen: what Download acts on

function setFile(f) {
  if (!f) return;
  sides = [];
  file.files = (() => { const dt = new DataTransfer(); dt.items.add(f); return dt.files; })();
  chosen.textContent = f.name;
  go.disabled = false;
  status.textContent = '';
  status.className = '';
  checkUpload(f);
}

// ---- Photo check -------------------------------------------------------------
// The server asks Claude what would cost likeness in the photo (photo_check.py)
// and what the hair is. Off when the server has no API key: nothing shows.
let hairHint = '', hairColour = '', checkToken = 0;
async function checkUpload(f) {
  const token = ++checkToken, advice = $('advice');
  hairHint = ''; hairColour = '';
  advice.replaceChildren();
  const body = new FormData();
  body.append('photo', f);
  let data;
  try { data = await (await fetch('/check', { method: 'POST', body })).json(); } catch { return; }
  if (token !== checkToken || !data.enabled || data.error) return;  // a newer photo, or no check
  hairHint = data.hair_cut;
  hairColour = data.hair_colour;
  const seen = `Seen: ${data.hair_style}, ${data.hair_colour}` +
    (data.facial_hair !== 'none' ? `, ${data.facial_hair}` : '') +
    (data.glasses !== 'none' ? `, ${data.glasses}` : '') + '.';
  const head = document.createElement('div');
  head.textContent = (data.advice.length ? 'Photo check, before you build: ' : 'Photo check: good to build from. ') + seen;
  advice.append(head);
  if (data.advice.length) {
    const list = document.createElement('ul');
    data.advice.forEach((a) => { const li = document.createElement('li'); li.textContent = a; list.append(li); });
    advice.append(list);
  }
}

$('pick').addEventListener('click', () => file.click());
file.addEventListener('change', () => setFile(file.files[0]));

['dragenter', 'dragover'].forEach((e) =>
  drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((e) =>
  drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (ev) => setFile(ev.dataTransfer.files[0]));

// ---- Guided capture ----------------------------------------------------------
// Three photos, each checked live against what the pipeline needs before it is
// taken: the face straight on, then the head turned to the person's left and to
// their right (views.py): the same landmarks moving sideways as the head turns
// measure how far the nose, lips and chin stand out, which one photo can only
// guess. Limits measured on the test photos: a face big enough to carry a
// likeness, at rest (a broad smile is never fully taken off the resting face),
// eyes open, sharp, light even across the cheeks, and the hair in frame. Once
// every check holds for half a second the photo takes itself; "Take photo
// anyway" overrides. Without a camera each step takes a photo file instead,
// checked the same way.
const FACE_PX = 500;             // cheek to cheek, as compose.photo_advice measures; twice its GOOD_FACE_PX
const MAX_TURN = 10;             // degrees left/right or up/down, front photo
const MAX_ROLL = 8;              // degrees of head tilt
const MAX_SMILE = 0.3;           // MediaPipe score where the shape fit starts damping a smile
const MAX_BLINK = 0.4;
const MAX_LIGHT_SPLIT = 0.25;    // cheek against cheek, share of the brighter
const SHARP_PX = 320;            // the face is scaled to this width before its sharpness is measured
const MIN_SHARP = 0.4;           // sharpness() below it is blurred; see side-session-notes/guided-capture.md
const STEADY_FRAMES = 15;
// Turned 30-45 degrees. At 11-23 real turned photos barely moved the depth;
// on a rendered test head two shots at 50 degrees left a third of the depth
// error two at 35 did. The cap is for the landmarks: at 55 the far eye hides
// and MediaPipe's reading wanders (it read the two sides 52 and 41). MediaPipe
// reads true turns of 20, 35 and 50 degrees as about 20, 29 and 42, and finds
// no face side-on: these are about its readings for 30 and 46.
const SIDE_TURN = [25, 40];
// MediaPipe's yaw sign when the head turns to the person's own left.
const LEFT = 1;
const STEPS = [
  { title: 'Front', side: null,
    ask: 'Look straight at the camera, mouth closed, face relaxed.' },
  { title: 'Turned to your left', side: LEFT,
    ask: 'Turn your head to your left, about a third of the way to a profile (30-45 degrees), keeping your chin level.' },
  { title: 'Turned to your right', side: -LEFT,
    ask: 'Now the same to your right.' },
];
const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

const video = $('video'), still = $('still'), camera = $('camera'), checks = $('checks'),
      camnote = $('camnote'), shoot = $('shoot'), stepfile = $('stepfile');
let stream = null, steady = 0, loop = 0, lastResults = [];
// step: which of STEPS is being taken; shots: { file, passed } per step taken;
// pending: a chosen photo that missed a check, kept until overridden or replaced.
let step = 0, shots = [], pending = null, sides = [];
const landmarkers = {};

/** One detector per mode: VIDEO tracks a face from frame to frame, which
 *  unrelated stills (checkStill) would confuse. */
async function getLandmarker(mode = 'VIDEO') {
  if (landmarkers[mode]) return landmarkers[mode];
  const { FilesetResolver, FaceLandmarker } = await import(`${VISION}/vision_bundle.mjs`);
  const files = await FilesetResolver.forVisionTasks(`${VISION}/wasm`);
  landmarkers[mode] = await FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: '/models/face_landmarker.task' },
    runningMode: mode, numFaces: 2,
    outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true,
  });
  return landmarkers[mode];
}

const sampler = document.createElement('canvas');
/** Mean brightness round a point, in a small copy of the frame. */
function brightness(source, width, height, x, y, radius) {
  const scale = 320 / width;
  sampler.width = 320; sampler.height = Math.round(height * scale);
  const ctx = sampler.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(source, 0, 0, sampler.width, sampler.height);
  const r = Math.max(2, Math.round(radius * scale));
  const data = ctx.getImageData(Math.round(x * scale) - r, Math.round(y * scale) - r, 2 * r, 2 * r).data;
  let sum = 0;
  for (let i = 0; i < data.length; i += 4) sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  return sum / (data.length / 4);
}

/** How sharp the face in the box [x0, y0, x1, y1] is, 0 (flat) to 1: the share
 *  of its edges' contrast that blurring it further takes away (Crete-Roffet's
 *  re-blur measure, per axis, the blurrier axis). A blurred face has little left
 *  to lose; unlike plain edge strength this does not depend on how much texture
 *  or contrast the face has. Scaled to SHARP_PX wide so any photo size compares:
 *  a small face enlarged to that width reads soft, as it is to the pipeline. */
function sharpness(source, x0, y0, x1, y1) {
  const scale = SHARP_PX / (x1 - x0);
  const w = SHARP_PX, h = Math.max(12, Math.round((y1 - y0) * scale));
  sampler.width = w; sampler.height = h;
  const ctx = sampler.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, x0, y0, x1 - x0, y1 - y0, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w * h);
  for (let i = 0; i < g.length; i++) g[i] = 0.299 * data[4 * i] + 0.587 * data[4 * i + 1] + 0.114 * data[4 * i + 2];
  const R = 4;   // a 9-pixel box blur
  const kept = (step, along, across) => {
    let edges = 0, lost = 0;
    for (let a = 0; a < across; a++) for (let t = R + 1; t < along - R; t++) {
      const at = (u) => g[a * (step === 1 ? w : 1) + u * step];
      let box = 0, prev = 0;
      for (let k = -R; k <= R; k++) { box += at(t + k); prev += at(t - 1 + k); }
      const d = Math.abs(at(t) - at(t - 1)), db = Math.abs(box - prev) / (2 * R + 1);
      edges += d; lost += Math.max(0, d - db);
    }
    return edges ? lost / edges : 0;
  };
  return Math.min(kept(1, w, h), kept(w, h, w));
}

/** Each check on one frame (`found`: the detector's result for it): [{ ok, text }],
 *  with the measures behind them on the array (`measured`). `side`: null for
 *  the front photo, else the yaw sign wanted (LEFT or -LEFT). */
function assess(found, source, width, height, side = null) {
  const faces = found.faceLandmarks || [];
  const out = [];
  const add = (ok, good, bad) => out.push({ ok, text: ok ? good : bad });
  if (faces.length !== 1) {
    add(false, '', faces.length ? 'Only one face in the picture, please' : 'No face found: look at the camera');
    return out;
  }
  const p = faces[0];
  const at = (i) => [p[i].x * width, p[i].y * height];
  const faceWidth = Math.abs(at(454)[0] - at(234)[0]);
  // Turned, the face shows narrower across the cheeks.
  const needPx = side === null ? FACE_PX : Math.round(0.8 * FACE_PX);
  add(faceWidth >= needPx, 'Face close enough',
      `Come closer: face ${Math.round(faceWidth)} px across, needs ${needPx}`);

  // Head pose from the face's transform (column-major 4x4).
  const m = found.facialTransformationMatrixes[0].data;
  const deg = 180 / Math.PI;
  const pitch = Math.atan2(m[6], m[10]) * deg, yaw = Math.asin(-m[2]) * deg, roll = Math.atan2(m[1], m[0]) * deg;
  if (side === null) {
    add(Math.abs(yaw) <= MAX_TURN && Math.abs(pitch) <= MAX_TURN, 'Facing the camera',
        Math.abs(yaw) > MAX_TURN ? 'Turn to face the camera' : 'Keep your chin level');
  } else {
    const [least, most] = SIDE_TURN;
    const turn = yaw * side;   // positive: the way wanted
    add(turn >= least && turn <= most && Math.abs(pitch) <= MAX_TURN, `Turned ${Math.round(turn)}° the right way`,
        turn < -MAX_TURN ? `Wrong way: turn to your ${side === LEFT ? 'left' : 'right'}`
          : turn < least ? `Turn further: ${Math.round(Math.max(turn, 0))}°, needs ${least}`
          : turn > most ? `Not quite so far: ${Math.round(turn)}°, at most ${most}` : 'Keep your chin level');
  }
  add(Math.abs(roll) <= MAX_ROLL, 'Head upright', 'Straighten your head');

  const score = Object.fromEntries(found.faceBlendshapes[0].categories.map((c) => [c.categoryName, c.score]));
  add(Math.max(score.mouthSmileLeft, score.mouthSmileRight, score.jawOpen) <= MAX_SMILE, 'Relaxed, mouth closed',
      'Relax your face: mouth closed, no smile');
  add(Math.max(score.eyeBlinkLeft, score.eyeBlinkRight) <= MAX_BLINK, 'Eyes open', 'Open your eyes');

  const ys = [10, 152].map((i) => at(i)[1]);
  const sharp = sharpness(source, Math.min(at(234)[0], at(454)[0]), ys[0], Math.max(at(234)[0], at(454)[0]), ys[1]);
  add(sharp >= MIN_SHARP, 'Sharp', 'Blurred: hold still, or more light');
  out.measured = { faceWidth: Math.round(faceWidth), yaw: +yaw.toFixed(1), pitch: +pitch.toFixed(1),
                   roll: +roll.toFixed(1), sharp: +sharp.toFixed(2),
                   mouth: +Math.max(score.mouthSmileLeft, score.mouthSmileRight, score.jawOpen).toFixed(2) };

  // A turned face is lit unevenly by its turn, and the hair was checked on the front photo.
  if (side !== null) return out;

  const radius = 0.06 * faceWidth;
  const left = brightness(source, width, height, ...at(50), radius);
  const right = brightness(source, width, height, ...at(280), radius);
  out.measured.lightSplit = +(Math.abs(left - right) / Math.max(left, right, 1)).toFixed(2);
  add(out.measured.lightSplit <= MAX_LIGHT_SPLIT, 'Even light',
      'The light falls on one side: face the window or lamp');

  const top = p[10].y - 0.45 * (p[152].y - p[10].y);
  add(top > 0 && p[152].y < 0.98, 'Head and hair in the picture',
      'Move back or lower the camera: the top of your hair must be in the picture');
  return out;
}

function showChecks(results) {
  checks.replaceChildren(...results.map((r) => {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : '';
    const mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = r.ok ? '✓' : '✗';
    li.append(mark, r.text);
    return li;
  }));
}

/** The video frame as it is, unmirrored. */
function grab() {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas;
}

/** One frame of the checks; `id` stops a loop that take or closeCamera ended. */
function tick(id) {
  if (id !== loop) return;
  if (video.readyState >= 2) {
    const found = landmarkers.VIDEO.detectForVideo(video, performance.now());
    lastResults = assess(found, video, video.videoWidth, video.videoHeight, STEPS[step].side);
    showChecks(lastResults);
    const ok = lastResults.every((r) => r.ok);
    camera.classList.toggle('ready', ok);
    steady = ok ? steady + 1 : 0;
    if (steady >= STEADY_FRAMES) { take(); return; }
  }
  requestAnimationFrame(() => tick(id));
}

/** The frame now, as this step's photo. */
async function take() {
  ++loop;
  const passed = lastResults.length > 0 && lastResults.every((r) => r.ok);
  const blob = await new Promise((done) => grab().toBlob(done, 'image/jpeg', 0.95));
  keep(new File([blob], `camera-${['front', 'left', 'right'][step]}-${Date.now()}.jpg`, { type: 'image/jpeg' }), passed);
}

/** A photo file for this step, checked as a camera frame is: kept if it
 *  passes, else shown with what it misses until overridden or replaced. */
async function checkStill(f) {
  ++loop;
  const id = loop;
  pending = null;
  shoot.hidden = true;
  checks.replaceChildren();
  camnote.textContent = 'Checking the photo…';
  still.src = URL.createObjectURL(f);
  still.hidden = false; video.hidden = true;
  let results;
  try {
    const detector = await getLandmarker('IMAGE');
    const img = await createImageBitmap(f);
    const canvas = document.createElement('canvas');
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    results = assess(detector.detect(canvas), canvas, canvas.width, canvas.height, STEPS[step].side);
  } catch (err) {
    results = [{ ok: false, text: `That photo could not be read (${err.message})` }];
  }
  if (id !== loop) return;
  showChecks(results);
  if (results.every((r) => r.ok)) { keep(f, true); return; }
  pending = f;
  shoot.hidden = false; shoot.textContent = 'Use this photo anyway';
  camnote.textContent = 'This photo misses a check: choose another, or use it anyway.';
}

/** This step's photo is `f`: show it in the strip and move to the next step. */
function keep(f, passed) {
  shots[step] = { file: f, passed };
  const fig = $('shots').children[step];
  fig.querySelector('img').src = URL.createObjectURL(f);
  fig.querySelector('figcaption').textContent =
    `${step + 1} · ${['Front', 'Your left', 'Your right'][step]} ${passed ? '✓' : '(override)'}`;
  step += 1;
  if (step >= STEPS.length) { finishCamera(); return; }
  beginStep();
}

function beginStep() {
  pending = null;
  steady = 0;
  [...$('shots').children].forEach((fig, k) => fig.classList.toggle('now', k === step));
  $('steptitle').textContent = `${step + 1} of 3 · ${STEPS[step].title}`;
  $('stepask').textContent = STEPS[step].ask;
  $('skip').hidden = step === 0;
  $('closecamera').textContent = step ? 'Done' : 'Cancel';
  checks.replaceChildren();
  camera.classList.remove('ready');
  if (stream) {
    still.hidden = true; video.hidden = false;
    shoot.hidden = false; shoot.textContent = 'Take photo anyway';
    camnote.textContent = 'Hold still once every line is ticked: the photo takes itself.';
    if (video.videoHeight && video.videoHeight < 1000 && step === 0)
      camnote.textContent += ` This camera gives ${video.videoHeight}-pixel frames: too few for a ${FACE_PX}-pixel face ` +
        'with the hair in. Take it anyway, or use a photo from a better camera.';
    const id = ++loop;
    requestAnimationFrame(() => tick(id));
  } else {
    ++loop;
    still.hidden = true; video.hidden = true;
    shoot.hidden = true;
    camnote.textContent = 'Choose a photo for this step: it is checked the same way.';
  }
}

async function openCamera() {
  camera.classList.add('open');
  step = 0; shots = []; sides = [];
  [...$('shots').children].forEach((fig, k) => {
    fig.querySelector('img').removeAttribute('src');
    fig.querySelector('figcaption').textContent = `${k + 1} · ${['Front', 'Your left', 'Your right'][k]}`;
  });
  status.textContent = '';
  status.className = '';
  shoot.hidden = true;
  // Browsers open the camera only on https or localhost; elsewhere (a phone on
  // the office network) each step takes a photo, which a phone opens its camera for.
  if (window.isSecureContext && navigator.mediaDevices?.getUserMedia) {
    camnote.textContent = 'Starting the camera…';
    try {
      stream = await navigator.mediaDevices.getUserMedia(
        { video: { facingMode: 'user', width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false });
      video.srcObject = stream;
      await video.play();
      camnote.textContent = 'Loading the face checks…';
      await getLandmarker();
    } catch (err) {
      closeStream();
      status.className = 'bad';
      status.textContent = `No camera (${err.name || err.message}): choose a photo for each step instead.`;
    }
  }
  beginStep();
}

function closeStream() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
}

function closeCamera() {
  ++loop;
  closeStream();
  camera.classList.remove('open', 'ready');
}

/** The front photo is handed on like a chosen one, the turned ones beside it. */
function finishCamera() {
  closeCamera();
  const [front, ...turned] = shots;
  if (!front) return;
  setFile(front.file);   // clears sides: set them after
  sides = turned.filter(Boolean).map((s) => s.file);
  if (sides.length) chosen.textContent += ` + ${sides.length} turned`;
  const missed = shots.map((s, k) => (s && !s.passed ? ['front', 'left', 'right'][k] : null)).filter(Boolean);
  status.className = missed.length ? 'bad' : '';
  status.textContent = `Front photo${sides.length ? ` and ${sides.length} turned` : ''} taken` +
    (missed.length ? `; ${missed.join(', ')} taken before every check passed: the avatar may look less like you.`
      : ', every check passed.') +
    (sides.length && !$('fullbody').checked ? ' The turned photos are used for full-body avatars only.' : '') +
    ' Generate when ready.';
}

$('usecamera').addEventListener('click', openCamera);
$('closecamera').addEventListener('click', () => (step ? finishCamera() : closeCamera()));
shoot.addEventListener('click', () => (pending ? keep(pending, false) : take()));
$('usefile').addEventListener('click', () => stepfile.click());
stepfile.addEventListener('change', () => { if (stepfile.files[0]) checkStill(stepfile.files[0]); stepfile.value = ''; });
$('skip').addEventListener('click', () => { step += 1; step >= STEPS.length ? finishCamera() : beginStep(); });

/** The checks on a still photo, with their measures (for testing them without a camera). */
async function checkPhoto(url, side = null) {
  const detector = await getLandmarker('IMAGE');
  // fetch + createImageBitmap: an unattached Image's decode() never settled here.
  const img = await createImageBitmap(await (await fetch(url)).blob());
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').drawImage(img, 0, 0);
  const results = assess(detector.detect(canvas), canvas, canvas.width, canvas.height, side);
  return { ok: results.every((r) => r.ok), failed: results.filter((r) => !r.ok).map((r) => r.text), ...results.measured };
}

drop.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!file.files[0]) return;
  go.disabled = true;
  status.className = '';
  status.textContent = 'Fitting the face…';

  const body = new FormData();
  body.append('photo', file.files[0]);
  sides.forEach((f) => body.append('side', f));
  body.append('mode', $('fullbody').checked ? 'body' : 'face');
  body.append('gender', $('gender').value);
  if (hairHint) body.append('hair_hint', hairHint);
  if (hairColour) body.append('hair_colour', hairColour);
  try {
    const res = await fetch('/generate', { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Generation failed.');
    current = { model: data.model, id: data.id, fullBody: $('fullbody').checked };
    show(data.review);
    status.textContent = `Done · ${data.info.triangles} triangles · ${data.info.size_kb} KB` +
      ((data.info.advice || []).length ? ` · Tip: ${data.info.advice[0]}` : '');
    $('resultmeta').textContent = downloadNote();
    loadGallery();
  } catch (err) {
    status.className = 'bad';
    status.textContent = err.message;
  } finally {
    go.disabled = false;
  }
});

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

$('download').addEventListener('click', async () => {
  if (!current) return;
  const button = $('download');
  const wasText = button.textContent;
  button.disabled = true;
  try {
    if ($('dimension').value === '2d') {
      button.textContent = 'Rendering…';
      const png = await renderPng(current.model, current.fullBody, $('photopose').checked);
      saveBlob(png, `${current.id}.png`);
    } else {
      // The GLB is already on the server; let the browser fetch it as a file.
      const link = document.createElement('a');
      const compat = $('dimension').value === '3d-compat';
      link.href = compat ? `/compat/${current.model.split('/').pop()}` : current.model;
      link.download = `${current.id}${compat ? '-compat' : ''}.glb`;
      link.click();
    }
  } catch (err) {
    status.className = 'bad';
    status.textContent = `Download failed: ${err.message}`;
  } finally {
    button.textContent = wasText;
    button.disabled = false;
  }
});

$('dimension').addEventListener('change', () => {
  if (!current) return;
  $('resultmeta').textContent = downloadNote();
});

function downloadNote() {
  return {
    '2d': 'Download gives a transparent PNG rendered from this avatar.',
    '3d': 'Download gives a GLB: opens in Unity, Unreal, Blender and three.js.',
    '3d-compat': 'Download gives a GLB without mesh compression, a third larger: also opens in Windows 3D Viewer.',
  }[$('dimension').value];
}

function show(reviewUrl) {
  viewer.src = reviewUrl;
  result.style.display = 'block';
  result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function loadGallery() {
  const items = await fetch('/gallery.json').then((r) => r.json()).catch(() => []);
  if (!items.length) { gallery.innerHTML = '<span class="empty">Nothing generated yet.</span>'; return; }
  gallery.innerHTML = '';
  for (const it of items) {
    const card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    const expr = it.expression.map(([k, v]) => k).join(', ') || 'neutral';
    const label = it.kind === 'full-body' ? (it.rigged ? 'full body · rigged' : 'full body') : 'face only';
    card.innerHTML =
      `<div class="shot"><img alt="" data-model="${it.model}">` +
      `<span class="badge ${it.kind === 'full-body' ? 'body' : ''}">${label}</span></div>` +
      `<div class="meta"><div class="when">${it.created}</div><div class="expr">${expr}</div></div>`;
    card.addEventListener('click', () =>
      show(`/review.html?model=${encodeURIComponent(it.model)}&photo=${encodeURIComponent(it.photo || '')}`));
    gallery.appendChild(card);
  }
  renderThumbnails();
}

// Thumbnails are renders of the avatar, not the photo it came from. Showing the
// source photo made the gallery look like a photo album and hid whether an entry
// was a face patch or a dressed figure.
const THUMB_W = 220, THUMB_H = 280;
let sharedRenderer = null;
const gltfLoader = new GLTFLoader();

function getRenderer(width, height) {
  if (!sharedRenderer) {
    // alpha, so a 2D export comes out on a transparent background and drops
    // straight into a UI without a backdrop to cut away.
    sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    sharedRenderer.setPixelRatio(1);
  }
  sharedRenderer.setSize(width, height);
  return sharedRenderer;
}

function disposeScene(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) { m?.map?.dispose(); m?.dispose(); }
  });
}

// One WebGL canvas serves the gallery and the downloads, so renders have to
// take turns. Without this a download fired while the gallery is still drawing
// captures whatever frame landed last — in practice, a blank image.
let renderTurn = Promise.resolve();
function takeTurn(job) {
  const run = renderTurn.then(job, job);
  renderTurn = run.then(() => {}, () => {});
  return run;
}

async function drawAvatar(url, width, height, focusHead = false, photoPose = false) {
  const gltf = await gltfLoader.loadAsync(url);
  const scene = new THREE.Scene();
  const lights = setupRealism(getRenderer(width, height), scene);

  const model = gltf.scene;
  applyMaterials(model);
  applyPhotoExpression(model);
  if (photoPose) applyPhotoPose(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  model.position.sub(centre);
  scene.add(model);
  groundAndShadow(scene, model, lights.key);

  // A long lens for the head, as a portrait photographer uses. The face is
  // shaped from the photo's landmarks, which already carry the photo's own
  // perspective; at 32 degrees, four head-depths away, the render added its
  // own and the face's sides, behind the eyes, read 3-4% narrower than the
  // photo's. Same framing, from four times as far.
  const fov = focusHead ? 8 : 32;
  const camera = new THREE.PerspectiveCamera(fov, width / height, 0.01, 400);
  // Fit whichever dimension needs the most room. Fitting width alone clipped the
  // head off every full-body avatar, which is the one thing the card must show.
  const span = focusHead ? size.y * 0.17 : size.y;
  const fit = Math.max(span, size.x / camera.aspect);
  const eye = focusHead ? size.y / 2 - size.y * 0.085 : 0;
  camera.position.set(0, eye, (fit / (2 * Math.tan((fov * Math.PI) / 360))) * 1.12);
  camera.lookAt(0, eye, 0);

  const renderer = getRenderer(width, height);
  const coverage = renderCoverage(renderer, scene, camera, model);
  const occlusion = withOcclusion(renderer, scene, camera, { coverage });
  occlusion.render();
  occlusion.dispose();
  coverage.dispose();
  disposeScene(model);
  return renderer.domElement;
}

/** Render and encode without letting go of the canvas in between. */
function renderAvatar(url, width, height, focusHead, encode, photoPose = false) {
  return takeTurn(async () => {
    const canvas = await drawAvatar(url, width, height, focusHead, photoPose);
    return encode(canvas);
  });
}

async function renderThumbnail(url) {
  return renderAvatar(url, THUMB_W, THUMB_H, false,
    (canvas) => canvas.toDataURL('image/webp', 0.8));
}

/** A 2D avatar: the 3D one rendered to a transparent PNG. `photoPose` turns
 * the head as it was in the photo instead of level. */
async function renderPng(url, fullBody, photoPose = false, size = 900) {
  const [w, h] = fullBody ? [size, Math.round(size * 4 / 3)] : [size, size];
  return renderAvatar(url, w, h, !fullBody,
    (canvas) => new Promise((resolve) => canvas.toBlob(resolve, 'image/png')), photoPose);
}

async function renderThumbnails() {
  // One at a time: each avatar is about a megabyte and they are only decoration.
  for (const img of gallery.querySelectorAll('img[data-model]')) {
    try {
      img.src = await renderThumbnail(img.dataset.model);
    } catch (err) {
      console.warn('thumbnail failed', img.dataset.model, err);
    }
  }
}

// Handle for checking the renderers from the console, same idea as
// window.__avatar on the review page.
window.__studio = { renderPng, renderThumbnail, checkPhoto };

loadGallery();
</script>
</body>
