<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar review</title>
<style>
  :root { --bg:#111317; --panel:#191c22; --line:#2a2f38; --text:#e8eaed; --muted:#9aa3af; --accent:#7cc4ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.2px; }
  header .meta { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); height:calc(100vh - 52px); }
  section { background:var(--panel); position:relative; min-width:0; }
  section > .label { position:absolute; top:10px; left:12px; z-index:2; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); background:rgba(17,19,23,.72); padding:3px 8px; border-radius:999px; }
  #photo { width:100%; height:100%; object-fit:contain; display:block; }
  #viewport { width:100%; height:100%; display:block; }
  #expression { position:absolute; left:12px; bottom:12px; z-index:2; background:rgba(17,19,23,.82);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; max-width:min(300px,70%); }
  #expression b { color:var(--accent); font-weight:600; }
  #expression div { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #hint { position:absolute; right:12px; bottom:12px; z-index:2; color:var(--muted); font-size:11px; }
  #hair { position:absolute; top:44px; right:12px; z-index:2; width:min(240px,46%); background:rgba(17,19,23,.86);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; }
  #hair[hidden] { display:none; }
  #hair b { color:var(--accent); font-weight:600; display:block; margin-bottom:6px; }
  #cuts { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; max-height:46vh; overflow-y:auto; margin-bottom:8px; }
  #cuts button { all:unset; cursor:pointer; border-radius:6px; border:2px solid transparent; text-align:center;
    color:var(--muted); font-size:10px; line-height:1.2; padding-bottom:2px; }
  #cuts button img { display:block; width:100%; aspect-ratio:1; border-radius:4px; background:var(--line); }
  #cuts button:hover, #cuts button:focus-visible { border-color:var(--line); }
  #cuts button[aria-pressed="true"] { border-color:var(--accent); color:var(--text); }
  #swatches { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #swatches button { width:22px; height:22px; border-radius:50%; border:2px solid var(--line); cursor:pointer; padding:0; }
  #swatches button[aria-pressed="true"] { border-color:var(--accent); }
  #swatches input { width:28px; height:24px; padding:0; border:0; background:none; cursor:pointer; }
  @media (max-width:760px){ main { grid-template-columns:1fr; height:auto; } section { height:60vh; } }
</style>
</head>
<body>
<header>
  <h1>Avatar review</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<main>
  <section><span class="label">Source photo</span><img id="photo" alt="source photo"></section>
  <section>
    <span class="label">Generated avatar</span>
    <canvas id="viewport"></canvas>
    <div id="expression"></div>
    <div id="hint">drag to orbit · scroll to zoom</div>
    <div id="hair" hidden>
      <b>Hair</b>
      <div id="cuts" role="group" aria-label="Haircut"></div>
      <div id="swatches" role="group" aria-label="Hair colour"></div>
    </div>
  </section>
</main>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { setupRealism, applyMaterials, groundAndShadow, withOcclusion, chooseHair } from '/lib/scene-setup.js';

const params = new URLSearchParams(location.search);
// With no model named, show the newest avatar rather than a hardcoded file:
// that default used to be an early face-only test, so opening the page bare
// looked like the engine only ever made faces.
const newest = await fetch('/gallery.json')
  .then((r) => (r.ok ? r.json() : []))
  .then((items) => items[0] || null)
  .catch(() => null);
const modelUrl = params.get('model') || newest?.model || 'out/portrait.glb';
const photoUrl = params.get('photo') || newest?.photo || 'samples/portrait.jpg';

document.getElementById('photo').src = photoUrl;

const canvas = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191c22);
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
camera.position.set(0, 0, 2.6);

const lights = setupRealism(renderer, scene);
// `ao=0` in the URL shows the plain render, for comparison.
const occlusion = params.get('ao') === '0' ? null : withOcclusion(renderer, scene, camera);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

function resize() {
  const { clientWidth: w, clientHeight: h } = canvas;
  if (canvas.width !== w || canvas.height !== h) {
    renderer.setSize(w, h, false);
    occlusion?.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

new GLTFLoader().load(modelUrl, (gltf) => {
  const model = gltf.scene;
  applyMaterials(model);

  // Frame the avatar regardless of how big it came out.
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);

  // On a full figure the head is a few dozen pixels, which is useless for
  // judging likeness, so `focus=head` frames the head instead of the body.
  const headFocus = params.get('focus') === 'head';
  const fit = headFocus ? size.y * 0.16 : Math.max(size.x, size.y);
  const distance = fit / (2 * Math.tan((camera.fov * Math.PI) / 360)) * 1.5;
  const eyeLevel = headFocus ? size.y / 2 - size.y * 0.09 : 0;
  camera.position.set(0, eyeLevel, distance);
  controls.target.set(0, eyeLevel, 0);
  controls.update();
  scene.add(model);
  groundAndShadow(scene, model, lights.key);
  // Handle for poking at the rig from the console: find a bone by name and
  // rotate it to check the skin follows. window.__avatar.getObjectByName('head')
  window.__avatar = model;
  modelReady(model);

  document.getElementById('meta').textContent =
    `${modelUrl.split('/').pop()} · ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} units`;
}, undefined, (err) => {
  document.getElementById('meta').textContent = 'failed to load ' + modelUrl;
  console.error(err);
});

// The hair picker: the cuts the file carries (compose's info.hair), the photo's
// own first, and colours, the photo's first. The choice is kept in
// window.__hair for the studio's download (/download?hair=…&colour=…).
let avatar = null, hairInfo = null;
const HAIR_COLOURS = [['black', [22, 20, 19]], ['dark brown', [52, 36, 27]], ['brown', [96, 64, 42]],
  ['auburn', [118, 56, 34]], ['blonde', [186, 148, 96]], ['light blonde', [200, 178, 138]], ['grey', [150, 148, 146]]];
window.__hair = null;

function modelReady(model) {
  avatar = model;
  buildPicker();
}

// Each cut's picture, on this head in the chosen colour: drawn with the
// viewer's own renderer and lights from a camera on the head, copied off the
// canvas before the next frame draws over it.
const THUMB = 96;
function drawThumbnails(colour) {
  const head = [];
  avatar.traverse((o) => { if (o.isMesh && o.material?.name === 'head') head.push(o); });
  if (!head.length) return;
  avatar.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(head[0]);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3()).add(new THREE.Vector3(0, size.y * 0.25, 0));
  const view = new THREE.PerspectiveCamera(30, canvas.width / canvas.height, 0.01, 100);
  const reach = size.y * 0.58 / Math.tan((view.fov * Math.PI) / 360);
  view.position.set(centre.x, centre.y, centre.z + reach);
  view.lookAt(centre);
  const side = Math.min(canvas.width, canvas.height);
  const out = document.createElement('canvas');
  out.width = out.height = THUMB;
  const pen = out.getContext('2d');
  for (const button of document.querySelectorAll('#cuts button')) {
    chooseHair(avatar, button.dataset.cut, colour);
    renderer.render(scene, view);
    pen.drawImage(canvas, (canvas.width - side) / 2, (canvas.height - side) / 2, side, side, 0, 0, THUMB, THUMB);
    button.querySelector('img').src = out.toDataURL('image/webp', 0.85);
  }
}

function wear(cut, colour) {
  const recolour = !window.__hair || window.__hair.colour.join() !== colour.join();
  if (avatar && recolour) drawThumbnails(colour);
  window.__hair = { cut, colour };
  if (avatar) chooseHair(avatar, cut, colour);
  document.querySelectorAll('#cuts button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cut === cut)));
  document.querySelectorAll('#swatches button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.rgb === colour.join(','))));
}

function buildPicker() {
  if (!avatar || !hairInfo || document.getElementById('cuts').childElementCount) return;
  const cuts = document.getElementById('cuts'), swatches = document.getElementById('swatches');
  const add = (parent, label, attrs, onClick) => {
    const b = document.createElement('button');
    b.type = 'button';
    Object.assign(b, attrs);
    if (label) b.textContent = label;
    b.addEventListener('click', onClick);
    parent.append(b);
    return b;
  };
  const pick = () => window.__hair;
  for (const { id, label } of [...hairInfo.options, { id: 'bald', label: 'No hair' }]) {
    const name = id === hairInfo.shown ? `${label} (from your photo)` : label;
    const b = add(cuts, '', { title: name, ariaLabel: name }, () => wear(id, pick().colour));
    b.dataset.cut = id;
    const img = document.createElement('img');
    img.alt = '';
    const caption = document.createElement('span');
    caption.textContent = id === hairInfo.shown ? 'Yours' : label;
    b.append(img, caption);
  }
  for (const [name, rgb] of [['from your photo', hairInfo.colour], ...HAIR_COLOURS]) {
    const b = add(swatches, '', { title: name, ariaLabel: name }, () => wear(pick().cut, rgb));
    b.style.background = `rgb(${rgb.join(',')})`;
    b.dataset.rgb = rgb.join(',');
  }
  const free = document.createElement('input');
  free.type = 'color';
  free.title = free.ariaLabel = 'any colour';
  free.addEventListener('input', () => wear(pick().cut, [1, 3, 5].map((i) => parseInt(free.value.slice(i, i + 2), 16))));
  swatches.append(free);
  document.getElementById('hair').hidden = false;
  wear(hairInfo.shown || 'bald', hairInfo.colour);
}

fetch(modelUrl.replace(/\.glb$/, '.json'))
  .then((r) => (r.ok ? r.json() : null))
  .then((info) => {
    if (!info) return;
    if (info.hair) { hairInfo = info.hair; buildPicker(); }
    const top = Object.entries(info.expression || {}).slice(0, 6);
    document.getElementById('expression').innerHTML =
      `<b>detected expression</b>` +
      (top.length
        ? top.map(([k, v]) => `<div>${k} · ${v}</div>`).join('')
        : '<div>neutral</div>') +
      `<div style="margin-top:6px">${info.landmarks} landmarks · ${info.triangles} tris</div>`;
  })
  .catch(() => {});

(function tick() {
  requestAnimationFrame(tick);
  resize();
  controls.update();
  if (occlusion) occlusion.render();
  else renderer.render(scene, camera);
})();
</script>
</body>
</html>
